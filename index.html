<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MGR CRM Premium</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="app">

    <aside class="sidebar">

        <div class="logo">
            MGR CRM
        </div>

        <nav class="menu">

            <a href="#" class="active">Dashboard</a>

            <a href="#">Leads</a>

            <a href="#">Clientes</a>

            <a href="#">Pipeline</a>

            <a href="#">Agenda</a>

            <a href="#">Consultorias</a>

            <a href="#">Financeiro</a>

            <a href="#">Relatórios</a>

            <a href="#">Configurações</a>

        </nav>

    </aside>

    <main class="content">

        <header class="topbar">

            <div>

                <h1>MGR CRM Premium</h1>

                <p>Sistema de Gestão Comercial</p>

            </div>

            <div class="profile">

                Marcelo Prestes

            </div>

        </header>

        <section class="dashboard">

            <div class="cards">

                <div class="card">

                    <span>Total de Leads</span>

                    <h2 id="totalLeads">0</h2>

                </div>

                <div class="card">

                    <span>Clientes</span>

                    <h2 id="totalClientes">0</h2>

                </div>

                <div class="card">

                    <span>Consultorias</span>

                    <h2 id="totalConsultorias">0</h2>

                </div>

                <div class="card">

                    <span>Conversão</span>

                    <h2 id="taxaConversao">0%</h2>

                </div>

            </div>

        </section>

    </main>

</div>

<script src="js/app.js"></script>

</body>

</html>
