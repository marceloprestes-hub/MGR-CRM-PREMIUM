<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGR CRM Premium</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#0f172a;
color:#fff;
display:flex;
height:100vh;
overflow:hidden;
}

aside{
width:260px;
background:#111827;
padding:30px;
display:flex;
flex-direction:column;
}

.logo{
font-size:26px;
font-weight:bold;
margin-bottom:40px;
color:#38bdf8;
}

.menu{
display:flex;
flex-direction:column;
gap:14px;
}

.menu a{
text-decoration:none;
color:#d1d5db;
padding:14px;
border-radius:10px;
transition:.3s;
}

.menu a:hover{
background:#1e293b;
color:white;
}

main{
flex:1;
padding:40px;
overflow:auto;
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:40px;
}

.usuario{
background:#1e293b;
padding:12px 20px;
border-radius:12px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:16px;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.valor{
font-size:34px;
font-weight:bold;
margin-top:10px;
color:#38bdf8;
}

</style>

</head>

<body>

<aside>

<div class="logo">
MGR CRM
</div>

<div class="menu">

<a href="#">Dashboard</a>
<a href="#">Leads</a>
<a href="#">Clientes</a>
<a href="#">Pipeline</a>
<a href="#">Agenda</a>
<a href="#">Consultorias</a>
<a href="#">Financeiro</a>
<a href="#">Relatórios</a>
<a href="#">Configurações</a>

</div>

</aside>

<main>

<div class="topo">

<h1>Dashboard Executivo</h1>

<div class="usuario">
Marcelo Prestes
</div>

</div>

<div class="cards">

<div class="card">
Leads
<div class="valor">0</div>
</div>

<div class="card">
Clientes
<div class="valor">0</div>
</div>

<div class="card">
Consultorias
<div class="valor">0</div>
</div>

<div class="card">
Conversão
<div class="valor">0%</div>
</div>

</div>

</main>

</body>
</html>
